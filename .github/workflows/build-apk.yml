
name: Build Money APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Money project
        run: |
          set -e
          unzip -o MoneyAndroid_APK_Build.zip -d /tmp/money-src
          PROJECT_DIR="$(dirname "$(find /tmp/money-src -type f -name settings.gradle -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Khong tim thay settings.gradle trong ZIP"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/app ./app
          cp -a "$PROJECT_DIR"/settings.gradle ./settings.gradle
          cp -a "$PROJECT_DIR"/build.gradle ./build.gradle
          if [ -f "$PROJECT_DIR/gradle.properties" ]; then
            cp -a "$PROJECT_DIR"/gradle.properties ./gradle.properties
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Money-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
